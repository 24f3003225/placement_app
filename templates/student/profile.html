{% extends "index.html" %}
{% block title %}My Profile{% endblock %}

{% block content %}

<h4 class="text-center mb-4">My Profile</h4>

<div style="max-width:500px; margin:auto;">

    <form method="post">

        <label>Name</label>
        <input type="text" name="studentname" value="{{ student.studentname }}" class="form-control mb-3" required>

        <label>Email</label>
        <input type="email" name="email" value="{{ user.email }}" class="form-control mb-3" required>

        <label>Institution</label>
        <input type="text" name="institution" value="{{ student.institution }}" class="form-control mb-3">

        <label>Course</label>
        <input type="text" name="course" value="{{ student.course }}" class="form-control mb-3">

        <label>Year</label>
        <input type="number" name="year_of_study" value="{{ student.year_of_study }}" class="form-control mb-3">

        <label>CGPA</label>
        <input type="text" name="cgpa" value="{{ student.cgpa }}" class="form-control mb-3">

        <label>Resume Link</label>
        <input type="text" name="resume_link" value="{{ student.resume_link }}" class="form-control mb-3">

        <button type="submit" class="btn btn-primary">
            Update Profile
        </button>

    </form>

</div>

{% endblock %}
