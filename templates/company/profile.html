{% extends "index.html" %}
{% block title %}Company Profile{% endblock %}

{% block content %}

<h4 class="text-center mb-4">Company Profile</h4>

<div style="max-width:500px; margin:auto;">
    <form method="post">

        <label>Company Name</label>
        <input type="text" name="companyname" value="{{ company.companyname }}" class="form-control mb-3" required>

        <label>Email</label>
        <input type="email" name="email" value="{{ user.email }}" class="form-control mb-3" required>

        <label>HR Name</label>
        <input type="text" name="hr_name" value="{{ company.hr_name }}" class="form-control mb-3" required>

        <label>HR Contact</label>
        <input type="text" name="hr_contact" value="{{ company.hr_contact }}" class="form-control mb-3" required>

        <button type="submit" class="btn btn-primary">
            Update Profile
        </button>

    </form>
</div>

{% endblock %}
