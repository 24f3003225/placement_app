{% extends "index.html" %}

{% block title %}Login{% endblock %}
{% block scripts %}
<style>
    .Login {
        width: 300px;
        padding: 20px;
        border: 1px solid #e7e3e3;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
</style>
{% endblock %}
{% block content %}
<div class="Login">
    <h2>Login</h2>
    <br>
    <form method="post">
        <label for="formGroupExampleInput" class="form-label">Email
            <input type="email" name="email" placeholder="Email" id="username" class="form-control"><br>
        </label><br>
        <label for="formGroupExampleInput2" class="form-label">Password
            <input type="password" name="password" placeholder="Password" id="password" class="form-control"><br>
        </label><br>
        <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
</div>
{% endblock %}
